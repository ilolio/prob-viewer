<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Confidence Viewer</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface2: #f1f3f5;
      --text: #1f2430;
      --text-dim: #6b7280;
      --accent: #2563eb;
      --accent-dim: #dbeafe;
      --border: #e3e6ec;
      --danger: #dc2626;
      --special: #7c3aed;
      --special-dim: #ede9fe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 40px;
    }

    .page-header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    select { cursor: pointer; height: 36px; }

    .icon-btn {
      flex: 0 0 auto;
      padding: 0;
      width: 36px;
      height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 6px;
    }
    .icon-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea { resize: vertical; }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .row .field { flex: 1; min-width: 90px; }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }
    button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      transition: opacity 0.15s, background 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #generateBtn {
      background: var(--accent);
      color: #fff;
    }
    #generateBtn.stopping {
      background: var(--danger);
      color: #fff;
    }
    #clearBtn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .hint {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* Collapsible card (文字種バイアス / special token) */
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .card-note {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-dim);
      margin-left: 8px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 折りたたみ（既定は閉じた状態） */
    .fold-card { padding: 0; }
    .fold-card > summary {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      list-style: none;
      border-radius: 10px;
    }
    .fold-card > summary::-webkit-details-marker { display: none; }
    .fold-card > summary::before {
      content: '▶';
      flex: 0 0 auto;
      margin-right: 8px;
      font-size: 0.6rem;
      color: var(--text-dim);
      transition: transform 0.15s;
    }
    .fold-card[open] > summary::before { transform: rotate(90deg); }
    .fold-card > summary:hover { background: var(--surface2); }
    .fold-card > summary:focus-visible { outline: 2px solid var(--accent); }
    .fold-card[open] > summary {
      border-bottom: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
    }
    .fold-body { padding: 4px 18px 18px; }

    /* 折りたたみ中でも適用状況がわかるバッジ */
    .fold-badge {
      margin-left: auto;
      flex: 0 0 auto;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      white-space: nowrap;
    }
    .fold-badge:empty { display: none; }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 14px;
    }
    .preset {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
    }
    .preset.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .preset.reset { margin-left: auto; }

    .bias-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }
    .bias-name {
      flex: 0 0 130px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .bias-name .bias-count {
      display: block;
      font-size: 0.66rem;
      color: var(--text-dim);
    }
    .bias-slider {
      flex: 1;
      min-width: 110px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .bias-value {
      flex: 0 0 52px;
      font-family: monospace;
      font-size: 0.8rem;
      text-align: right;
      color: var(--text-dim);
    }
    .bias-value.up   { color: #15803d; font-weight: 700; }
    .bias-value.down { color: var(--danger); font-weight: 700; }

    .fold-summary {
      margin-top: 10px;
      font-size: 0.74rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* Special token */
    /* label の既定（大文字化・字間）を打ち消したチェックボックス行 */
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 4px;
      font-size: 0.78rem;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      cursor: pointer;
    }
    .check-row input[type="checkbox"] {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      accent-color: var(--special);
      cursor: pointer;
    }
    .check-row code {
      font-size: 0.74rem;
      background: var(--surface2);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .special-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0 7px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .special-head .icon-btn {
      width: 26px;
      height: 26px;
      font-size: 0.9rem;
    }

    .special-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      font-family: monospace;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    /* /props から取得した、このモデル固有の special token */
    .chip.model {
      background: var(--special-dim);
      border-color: var(--special);
      color: var(--special);
      font-weight: 700;
    }
    .chip.in-prompt { box-shadow: inset 0 -2px 0 var(--special); }

    .token-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 12px;
      max-height: 190px;
      overflow-y: auto;
    }
    .token-preview:empty { display: none; }
    .tp-tok {
      font-family: monospace;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      white-space: pre;
    }
    .tp-tok.special {
      background: var(--special-dim);
      border-color: var(--special);
      color: var(--special);
      font-weight: 700;
    }

    /* Output area */
    #output {
      font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
      font-size: 0.95rem;
      line-height: 2.1;
      word-break: break-word;
      min-height: 80px;
    }

    #status {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-dim);
      min-height: 1.2em;
    }
    #status.error { color: var(--danger); }

    /* Token spans */
    .tok {
      display: inline;
      color: var(--text);
      border-radius: 4px;
      padding: 1px 2px;
      cursor: default;
      transition: filter 0.1s;
      white-space: pre-wrap;
    }
    .tok:hover { filter: brightness(0.93); }
    .tok.no-prob {
      background: transparent;
      color: var(--text-dim);
    }

    /* Special token は紫の枠で区別（背景色は確率のまま） */
    .tok.tok-special {
      outline: 1px dashed var(--special);
      outline-offset: -1px;
      color: var(--special);
      font-weight: 700;
    }

    /* Newline visual marker */
    .tok-nl::after {
      content: '↵';
      font-size: 0.7em;
      opacity: 0.6;
      margin-right: 1px;
    }

    /* Legend */
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .legend-bar {
      flex: 1;
      max-width: 200px;
      height: 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: linear-gradient(to right,
        hsl(0,68%,90%),
        hsl(30,68%,87%),
        hsl(60,68%,85%),
        hsl(90,68%,82%),
        hsl(120,68%,78%)
      );
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      z-index: 9999;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      pointer-events: none;
      min-width: 220px;
      max-width: 320px;
      box-shadow: 0 8px 28px rgba(15,23,42,0.14);
      font-size: 0.83rem;
    }
    #tooltip.hidden { display: none; }

    .tt-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .tt-token {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 11px;
      word-break: break-all;
    }
    .tt-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }
    .tt-row:last-child { margin-bottom: 0; }
    .tt-tok {
      font-family: monospace;
      font-size: 0.8rem;
      min-width: 72px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .tt-row.chosen .tt-tok {
      font-weight: 700;
      color: var(--accent);
    }
    .tt-bar-wrap {
      flex: 1;
      height: 10px;
      background: var(--surface2);
      border-radius: 5px;
      overflow: hidden;
    }
    .tt-bar {
      height: 100%;
      border-radius: 5px;
      transition: width 0.1s;
    }
    .tt-pct {
      font-size: 0.77rem;
      color: var(--text-dim);
      min-width: 38px;
      text-align: right;
    }
    .tt-row.chosen .tt-pct { color: var(--text); font-weight: 600; }

    .tt-flag {
      display: inline-block;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      vertical-align: middle;
      margin-left: 5px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--special-dim);
      color: var(--special);
    }
    .tt-tok.special { color: var(--special); }

    .tt-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    @media (max-width: 580px) {
      body { padding: 14px 14px 32px; }
      .row { flex-direction: column; }
      .hint { display: none; }
      .card-note { display: none; }
      .bias-name { flex-basis: 96px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>Token Confidence Viewer</h1>
  <div class="subtitle">llama-server の n_probs でトークンごとの信頼度をヒートマップ表示</div>
</div>

<div class="card">
  <div class="row">
    <div class="field" style="flex:2">
      <label>Server URL</label>
      <input type="text" id="serverUrl" value="http://localhost:8080" spellcheck="false">
    </div>
    <div class="field" style="flex:3">
      <label>Model</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="model" style="flex:1"></select>
        <button id="refreshModelsBtn" type="button" class="icon-btn" title="モデル一覧を再取得">⟳</button>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Prompt <span style="text-transform:none;font-weight:400;letter-spacing:0">(Ctrl+Enter で生成)</span></label>
    <textarea id="prompt" rows="4" placeholder="プロンプトを入力...">昔々あるところに</textarea>
  </div>
  <div class="row">
    <div class="field">
      <label>n_predict</label>
      <input type="number" id="nPredict" value="200" min="1" max="4096">
    </div>
    <div class="field">
      <label>n_probs (候補数)</label>
      <input type="number" id="nProbs" value="5" min="1" max="40">
    </div>
    <div class="field">
      <label>Temperature</label>
      <input type="number" id="temperature" value="0.8" min="0" max="2" step="0.05">
    </div>
  </div>
  <div class="btn-row">
    <button id="generateBtn">Generate</button>
    <button id="clearBtn">Clear</button>
    <span class="hint">CORS設定が必要な場合: <code>--cors-allow-origins "*"</code></span>
  </div>
</div>

<details class="card fold-card" id="specialCard">
  <summary class="card-title">Special token<span class="card-note">プロンプトへの挿入と、出力での表示を切り替え</span><span class="fold-badge" id="specialBadge"></span></summary>
  <div class="fold-body">
    <label class="check-row">
      <input type="checkbox" id="specialOutput" checked>
      <span>出力に special token を表示する（リクエストに <code>special: true</code> を送信）</span>
    </label>
    <div class="special-head">
      <span>プロンプトへ挿入</span>
      <button id="refreshSpecialBtn" type="button" class="icon-btn" title="/props から special token を再取得">⟳</button>
    </div>
    <div class="special-chips" id="specialChips"></div>
    <div class="btn-row">
      <button id="tokenizeBtn" type="button" class="preset">プロンプトをトークナイズして確認</button>
    </div>
    <div class="token-preview" id="tokenPreview"></div>
    <div class="fold-summary" id="specialSummary"></div>
  </div>
</details>

<details class="card fold-card" id="biasCard">
  <summary class="card-title">文字種バイアス<span class="card-note">logit_bias で出やすさを調整（確率 0 にはしません）</span><span class="fold-badge" id="biasBadge"></span></summary>
  <div class="fold-body">
    <div class="preset-row" id="presetRow"></div>
    <div id="biasControls"></div>
    <div class="fold-summary" id="biasSummary"></div>
  </div>
</details>

<div class="card">
  <div id="output"></div>
  <div id="status"></div>
</div>

<div class="legend">
  <span>低信頼</span>
  <div class="legend-bar"></div>
  <span>高信頼</span>
</div>

<div id="tooltip" class="hidden"></div>

<script>
  let abortController = null;
  let generating = false;

  // --- Model list ---
  function currentServerUrl() {
    return document.getElementById('serverUrl').value.trim().replace(/\/+$/, '');
  }

  async function loadModels() {
    const serverUrl = currentServerUrl();
    const select = document.getElementById('model');
    const btn = document.getElementById('refreshModelsBtn');
    const prev = select.value;
    btn.classList.add('spinning');
    try {
      const res = await fetch(`${serverUrl}/v1/models`);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      const ids = (data.data || []).map(m => m.id).filter(Boolean);
      if (ids.length === 0) throw new Error('モデルが返されませんでした');

      select.innerHTML = '';
      ids.forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      });
      // 以前の選択を復元（存在すれば）
      if (ids.includes(prev)) select.value = prev;
      setStatus(`モデル ${ids.length} 件を取得`);
    } catch (err) {
      select.innerHTML = '';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '取得失敗';
      select.appendChild(opt);
      setStatus(`モデル一覧の取得に失敗: ${err.message}`, true);
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // --- Color helpers ---
  function probToHsl(prob) {
    const hue = prob * 120; // 0=赤(低信頼) → 120=緑(高信頼)
    const light = 93 - prob * 15; // 低信頼=淡く(93%)、高信頼=やや濃く(78%)
    return `hsl(${hue.toFixed(1)}, 68%, ${light.toFixed(1)}%)`;
  }

  // --- HTML escaping ---
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Render token string for display (show repr of whitespace/control chars)
  function displayStr(s) {
    return JSON.stringify(s).slice(1, -1); // strip surrounding quotes
  }

  // --- Token DOM element ---
  function makeToken(content, probs) {
    // probs: [{tok_str, prob, chosen}, ...] 確率降順。chosen=実際に選ばれたトークン
    const chosen = probs && probs.find(p => p.chosen);
    const chosenProb = chosen ? chosen.prob
                     : ((probs && probs.length > 0) ? probs[0].prob : null);

    const span = document.createElement('span');
    span.className = 'tok';

    if (chosenProb !== null) {
      span.style.backgroundColor = probToHsl(chosenProb);
      // 文字色は常に濃色で固定（淡い背景でも読みやすく）
    } else {
      span.classList.add('no-prob');
    }

    // Visual newline marker
    const hasNewline = content.includes('\n');
    if (hasNewline) span.classList.add('tok-nl');

    // special token（<|im_end|> など）は枠線で区別する
    const special = isSpecialToken(content);
    if (special) span.classList.add('tok-special');
    span.dataset.special = special ? '1' : '';

    span.textContent = content;
    span.dataset.probs = JSON.stringify(probs || []);
    span.dataset.content = content;

    span.addEventListener('mouseenter', onTokenEnter);
    span.addEventListener('mouseleave', onTokenLeave);
    span.addEventListener('mousemove', onTokenMove);

    return span;
  }

  // --- Tooltip ---
  const tooltip = document.getElementById('tooltip');
  let lastMouseX = 0, lastMouseY = 0;

  function onTokenEnter(e) {
    const probs = JSON.parse(e.currentTarget.dataset.probs || '[]');
    const content = e.currentTarget.dataset.content;
    if (!probs.length) return;

    const maxProb = Math.max(...probs.map(p => p.prob));

    const special = e.currentTarget.dataset.special === '1';

    let html = `<div class="tt-label">選択されたトークン</div>`;
    html += `<div class="tt-token">${esc(displayStr(content))}`
          + (special ? `<span class="tt-flag">special token</span>` : '')
          + `</div>`;
    html += `<div class="tt-divider"></div>`;
    html += `<div class="tt-label">上位候補</div>`;

    probs.forEach((p) => {
      const barW = maxProb > 0 ? (p.prob / maxProb * 100).toFixed(1) : 0;
      const pct = (p.prob * 100).toFixed(2);
      const color = probToHsl(p.prob);
      const chosen = p.chosen ? 'chosen' : '';
      const mark = p.chosen ? ' ✓' : '';
      const sp = isSpecialToken(p.tok_str) ? ' special' : '';
      html += `
        <div class="tt-row ${chosen}">
          <span class="tt-tok${sp}" title="${esc(displayStr(p.tok_str))}">${esc(displayStr(p.tok_str))}${mark}</span>
          <div class="tt-bar-wrap">
            <div class="tt-bar" style="width:${barW}%;background:${color}"></div>
          </div>
          <span class="tt-pct">${pct}%</span>
        </div>`;
    });

    tooltip.innerHTML = html;
    tooltip.classList.remove('hidden');
    positionTooltip(e.clientX, e.clientY);
  }

  function onTokenLeave() {
    tooltip.classList.add('hidden');
  }

  function onTokenMove(e) {
    positionTooltip(e.clientX, e.clientY);
  }

  function positionTooltip(cx, cy) {
    const m = 14;
    const tw = tooltip.offsetWidth || 240;
    const th = tooltip.offsetHeight || 160;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let x = cx + m;
    let y = cy + m;
    if (x + tw > vw - m) x = cx - tw - m;
    if (y + th > vh - m) y = cy - th - m;
    if (x < m) x = m;
    if (y < m) y = m;

    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }

    w => Array.from(w).every(ch => chineseOnlySet.has(ch))

  const BIAS_STEP  = 0.25;

    { key: 'kata',  label: 'カタカナ',        entries: uniq(KATAKANA) },

    { key: 'digit', label: '数字',            entries: uniq(DIGITS) },

  const biasValues = {};
  BIAS_CLASSES.forEach(c => { biasValues[c.key] = 0; });

  function clampBias(v) {
    if (!isFinite(v)) return 0;
    return Math.max(-BIAS_LIMIT, Math.min(BIAS_LIMIT, v));
  }

  function renderBiasControls() {
    const presetRow = document.getElementById('presetRow');
    presetRow.innerHTML = '';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset';
      btn.dataset.presetId = preset.id;
      btn.textContent = preset.label;
      btn.title = Object.entries(preset.values)
        .map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ')
        + '（もう一度押すと解除）';
      btn.addEventListener('click', () => togglePreset(preset));
      presetRow.appendChild(btn);
    });

    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'preset reset';
    resetBtn.textContent = 'リセット';
    resetBtn.addEventListener('click', () => {
      BIAS_CLASSES.forEach(c => { biasValues[c.key] = 0; });
      syncBiasUI();
    });
    presetRow.appendChild(resetBtn);

    const wrap = document.getElementById('biasControls');
    wrap.innerHTML = '';
    BIAS_CLASSES.forEach(cls => {
      const row = document.createElement('div');
      row.className = 'bias-row';

      const name = document.createElement('div');
      name.className = 'bias-name';
      name.innerHTML = `${esc(cls.label)}<span class="bias-count">${cls.entries.length} 項目</span>`;

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'bias-slider';
      slider.min = String(-BIAS_LIMIT);
      slider.max = String(BIAS_LIMIT);
      slider.step = String(BIAS_STEP);
      slider.value = '0';
      slider.dataset.key = cls.key;
      slider.addEventListener('input', () => {
        biasValues[cls.key] = clampBias(parseFloat(slider.value));
        syncBiasUI();

      const val = document.createElement('span');
      val.className = 'bias-value';
      val.dataset.key = cls.key;

      row.appendChild(name);
      row.appendChild(slider);
      row.appendChild(val);
      wrap.appendChild(row);
    });

    syncBiasUI();

  // プリセットは押すたびに「適用 ⇄ 解除」を切り替える
  function togglePreset(preset) {
    const alreadyOn = Object.entries(preset.values)
      .every(([k, v]) => Math.abs(biasValues[k] - v) < 1e-6);
    Object.entries(preset.values).forEach(([k, v]) => {
      biasValues[k] = alreadyOn ? 0 : clampBias(v);
    });
    syncBiasUI();
  }

  function syncBiasUI() {
    BIAS_CLASSES.forEach(cls => {
      const v = biasValues[cls.key];
      const slider = document.querySelector(`.bias-slider[data-key="${cls.key}"]`);
      const val    = document.querySelector(`.bias-value[data-key="${cls.key}"]`);
      if (slider) slider.value = String(v);
      if (val) {
        val.textContent = `${v > 0 ? '+' : ''}${v.toFixed(2)}`;
        val.className = 'bias-value' + (v > 0 ? ' up' : v < 0 ? ' down' : '');
      }
    });

    document.querySelectorAll('.preset[data-preset-id]').forEach(btn => {
      const preset = PRESETS.find(p => p.id === btn.dataset.presetId);
      const on = preset && Object.entries(preset.values)
        .every(([k, v]) => Math.abs(biasValues[k] - v) < 1e-6);
      btn.classList.toggle('active', !!on);
    });

    const active = BIAS_CLASSES.filter(c => biasValues[c.key] !== 0);
    const summary = document.getElementById('biasSummary');

    // 折りたたんでいても適用中かどうかが見えるようにヘッダへ表示
    const badge = document.getElementById('biasBadge');
    badge.textContent = active.length === 0 ? '' : `${active.length} 種類 適用中`;
    badge.title = active.length === 0 ? '' : active
      .map(c => `${c.label} ${biasValues[c.key] > 0 ? '+' : ''}${biasValues[c.key].toFixed(2)}`)
      .join(' / ');
    if (active.length === 0) {
      summary.textContent = 'バイアスなし（logit_bias は送信しません）。';
    } else {
      const total = active.reduce((n, c) => n + c.entries.length, 0);
      const parts = active.map(c => {
        const v = biasValues[c.key];
        return `${c.label} ${v > 0 ? '+' : ''}${v.toFixed(2)}`;
      });
      summary.textContent =
        `適用中: ${parts.join(' / ')} — logit_bias ${total} 件を送信。`
        + ' プラスで出やすく、マイナスで出にくくなります（0 にはなりません）。';
    }
  }

  // リクエスト用の logit_bias を組み立てる
  function buildLogitBias() {
    const out = [];
    BIAS_CLASSES.forEach(cls => {
      const v = clampBias(biasValues[cls.key]);
      if (Math.abs(v) < 1e-6) return;
      cls.entries.forEach(entry => out.push([entry, v]));
    });
    return out;
  }

  // --- Special token ---
  // 入力：/completion のプロンプトは parse_special 付きでトークナイズされるため、
  //       <|im_start|> などをそのまま書けば 1 トークンとして解釈される。
  //       チップで挿入でき、/tokenize で実際に 1 トークンになるか確認できる。
  // 出力：llama-server は既定で special token を content から取り除く。
  //       リクエストに special: true を送ると出力にもそのまま現れる。

  // モデルを問わず出てくる代表的な special token（/props で取れない分の補助）
  const BUILTIN_SPECIAL_TOKENS = [
    '<s>', '</s>', '<unk>', '<pad>', '<mask>',
    '<|endoftext|>', '<|begin_of_text|>', '<|end_of_text|>',
    '<|im_start|>', '<|im_end|>',
    '<|start_header_id|>', '<|end_header_id|>', '<|eot_id|>', '<|eom_id|>',
    '<start_of_turn>', '<end_of_turn>',
    '<|system|>', '<|user|>', '<|assistant|>',
    '<|fim_prefix|>', '<|fim_middle|>', '<|fim_suffix|>',
    '[INST]', '[/INST]', '<<SYS>>', '<</SYS>>',
  ];

  // <|...|> 形式は既知リストになくても special token とみなす
  const SPECIAL_LIKE = /^<\|[^<>]*\|>$/;

  // /props（bos_token / eos_token / chat_template）から拾った、このモデル固有のもの
  let modelSpecialTokens = [];
  let specialTokenSet = new Set(BUILTIN_SPECIAL_TOKENS);

  function rebuildSpecialTokenSet() {
    specialTokenSet = new Set(BUILTIN_SPECIAL_TOKENS.concat(modelSpecialTokens));
  }

  function knownSpecialTokens() {
    // モデル固有のものを先頭に、既定の候補を後ろに並べる
    return modelSpecialTokens.concat(
      BUILTIN_SPECIAL_TOKENS.filter(t => !modelSpecialTokens.includes(t))
    );
  }

  function isSpecialToken(str) {
    if (typeof str !== 'string' || str === '') return false;
    return specialTokenSet.has(str) || SPECIAL_LIKE.test(str);
  }

  // チャットテンプレート（Jinja）から <|...|> / <...> / [INST] 形式を抜き出す
  function extractSpecialFromTemplate(tpl) {
    const re = /<\|[^<>|]+\|>|<<\/?SYS>>|<\/?[A-Za-z][A-Za-z0-9_]*>|\[\/?INST\]/g;
    return (tpl.match(re) || []);
  }

  function uniqList(arr) {
    return Array.from(new Set(arr.filter(t => typeof t === 'string' && t !== '')));
  }

  function setSpecialNote(msg, isError = false) {
    const el = document.getElementById('specialSummary');
    el.textContent = msg;
    el.style.color = isError ? 'var(--danger)' : '';
  }

  // /props からモデル固有の special token を取得
  async function loadSpecialTokens() {
    const serverUrl = currentServerUrl();
    const btn = document.getElementById('refreshSpecialBtn');
    btn.classList.add('spinning');
    try {
      const res = await fetch(`${serverUrl}/props`);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const props = await res.json();
      const found = [props.bos_token, props.eos_token, props.eot_token];
      const tpl = typeof props.chat_template === 'string' ? props.chat_template : '';
      extractSpecialFromTemplate(tpl).forEach(t => found.push(t));
      modelSpecialTokens = uniqList(found);
      setSpecialNote(modelSpecialTokens.length > 0
        ? `/props からモデル固有の special token ${modelSpecialTokens.length} 件を取得（紫のチップ）。`
        : '/props からは special token を検出できませんでした。既定の候補のみ表示しています。');
    } catch (err) {
      modelSpecialTokens = [];
      setSpecialNote(`/props の取得に失敗: ${err.message} — 既定の候補のみ表示しています。`, true);
      setStatus(`special token の取得に失敗: ${err.message}`, true);
    } finally {
      btn.classList.remove('spinning');
      rebuildSpecialTokenSet();
      renderSpecialChips();
      updateSpecialBadge();
    }
  }

  function renderSpecialChips() {
    const wrap = document.getElementById('specialChips');
    const promptText = document.getElementById('prompt').value;
    wrap.innerHTML = '';
    knownSpecialTokens().forEach(tok => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip'
        + (modelSpecialTokens.includes(tok) ? ' model' : '')
        + (promptText.includes(tok) ? ' in-prompt' : '');
      btn.textContent = tok;
      btn.title = modelSpecialTokens.includes(tok)
        ? 'このモデルの special token — クリックでプロンプトに挿入'
        : '一般的な special token — クリックでプロンプトに挿入';
      btn.addEventListener('click', () => insertIntoPrompt(tok));
      wrap.appendChild(btn);
    });
  }

  // カーソル位置に挿入（選択範囲があれば置換）
  function insertIntoPrompt(text) {
    const el = document.getElementById('prompt');
    const start = el.selectionStart ?? el.value.length;
    const end   = el.selectionEnd   ?? el.value.length;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    const pos = start + text.length;
    el.focus();
    el.setSelectionRange(pos, pos);
    updateSpecialBadge();
  }

  // プロンプトに含まれる special token を数える
  function findSpecialInPrompt(text) {
    const hits = [];
    knownSpecialTokens().forEach(tok => {
      let idx = 0, count = 0;
      while ((idx = text.indexOf(tok, idx)) !== -1) { count++; idx += tok.length; }
      if (count > 0) hits.push({ token: tok, count });
    });
    return hits;
  }

  function specialOutputEnabled() {
    return document.getElementById('specialOutput').checked;
  }

  function updateSpecialBadge() {
    const promptText = document.getElementById('prompt').value;
    const hits = findSpecialInPrompt(promptText);
    const total = hits.reduce((n, h) => n + h.count, 0);
    const badge = document.getElementById('specialBadge');

    const parts = [];
    if (total > 0) parts.push(`プロンプト ${total}`);
    parts.push(specialOutputEnabled() ? '出力 表示' : '出力 非表示');
    badge.textContent = parts.join(' / ');
    badge.title = total > 0
      ? hits.map(h => `${h.token} ×${h.count}`).join(' / ')
      : 'プロンプトに special token はありません';

    renderSpecialChips();
  }

  // /tokenize で、プロンプトが実際にどう分割されるかを確認する
  async function tokenizePrompt() {
    const serverUrl = currentServerUrl();
    const promptText = document.getElementById('prompt').value;
    const preview = document.getElementById('tokenPreview');
    const btn = document.getElementById('tokenizeBtn');

    btn.disabled = true;
    preview.innerHTML = '';
    try {
      const res = await fetch(`${serverUrl}/tokenize`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: promptText, with_pieces: true }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      renderTokenPreview(Array.isArray(data.tokens) ? data.tokens : []);
    } catch (err) {
      setSpecialNote(`トークナイズに失敗: ${err.message}`, true);
      setStatus(`トークナイズに失敗: ${err.message}`, true);
    } finally {
      btn.disabled = false;
    }
  }

  function renderTokenPreview(tokens) {
    const preview = document.getElementById('tokenPreview');
    preview.innerHTML = '';

    if (tokens.length === 0) {
      setSpecialNote('トークンが返されませんでした（プロンプトが空の可能性があります）。');
      return;
    }

    // with_pieces 未対応のサーバは ID の配列だけを返す
    if (typeof tokens[0] === 'number') {
      tokens.forEach(id => {
        const el = document.createElement('span');
        el.className = 'tp-tok';
        el.textContent = `#${id}`;
        preview.appendChild(el);
      });
      setSpecialNote(
        `${tokens.length} トークン。このサーバは /tokenize の with_pieces に未対応のため、`
        + 'トークン ID のみ表示しています（special token の判別はできません）。');
      return;
    }

    let specialCount = 0;
    tokens.forEach(t => {
      // piece は文字列。UTF-8 として不正なトークンはバイト配列で返ることがある。
      const isBytes = Array.isArray(t.piece);
      const piece   = typeof t.piece === 'string' ? t.piece : '';
      const label   = isBytes
        ? t.piece.map(b => '\\x' + b.toString(16).padStart(2, '0')).join('')
        : displayStr(piece);
      const special = isSpecialToken(piece);
      if (special) specialCount++;

      const el = document.createElement('span');
      el.className = 'tp-tok' + (special ? ' special' : '');
      el.textContent = label;
      el.title = `id: ${t.id}`;
      preview.appendChild(el);
    });

    setSpecialNote(
      `${tokens.length} トークン（うち special token ${specialCount} 件）。`
      + ' special token が 1 つのトークンになっていれば、プロンプトとして正しく解釈されています。');
  }

  // --- Generate ---
  function setGenerating(v) {
    generating = v;
    const btn = document.getElementById('generateBtn');
    if (v) {
      btn.textContent = 'Stop';
      btn.classList.add('stopping');
    } else {
      btn.textContent = 'Generate';
      btn.classList.remove('stopping');
    }
    document.getElementById('clearBtn').disabled = v;
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function clearOutput() {
    document.getElementById('output').innerHTML = '';
    setStatus('');
  }

  async function handleGenerate() {
    if (generating) {
      abortController?.abort();
      return;
    }

    const serverUrl = currentServerUrl();
    const model     = document.getElementById('model').value;
    const prompt    = document.getElementById('prompt').value;
    const nPredict  = parseInt(document.getElementById('nPredict').value) || 200;
    const nProbs    = parseInt(document.getElementById('nProbs').value) || 5;
    const temp      = parseFloat(document.getElementById('temperature').value);
    const logitBias = buildLogitBias();
    const special   = specialOutputEnabled();

    clearOutput();
    setGenerating(true);
    setStatus('接続中...');

    abortController = new AbortController();
    const outputEl = document.getElementById('output');

    try {
      const res = await fetch(`${serverUrl}/completion`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          n_predict: nPredict,
          n_probs:   nProbs,
          temperature: isNaN(temp) ? 0.8 : temp,
          stream: true,
          // true にすると <|im_end|> などが content にそのまま載る（既定は除去される）
          special,
          ...(logitBias.length > 0 ? { logit_bias: logitBias } : {}),
          ...(model ? { model } : {}),
        }),
        signal: abortController.signal,
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }

      setStatus('生成中...');

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let tokenCount = 0;
      let specialCount = 0;

      outer: while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });

        let nl;
        while ((nl = buf.indexOf('\n')) !== -1) {
          const line = buf.slice(0, nl).trimEnd();
          buf = buf.slice(nl + 1);

          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') break outer;

          let data;
          try { data = JSON.parse(raw); } catch { continue; }

          // stop チャンクにも content が載ることがある（special: true では EOS 自身）。
          // 取りこぼさないよう、先に content を処理してから終了する。
          const content = data.content ?? '';
          let probs = [];
          if (Array.isArray(data.completion_probabilities) && data.completion_probabilities.length > 0) {
            const cp = data.completion_probabilities[0];
            // 新しい llama-server は top_logprobs(token/logprob)、旧版は probs(tok_str/prob)
            const cands = cp.top_logprobs ?? cp.probs ?? [];
            const chosenId = cp.id;
            probs = cands.map(c => ({
              tok_str: c.token ?? c.tok_str ?? '',
              prob: c.prob != null ? c.prob
                  : (c.logprob != null ? Math.exp(c.logprob) : 0),
              chosen: (chosenId != null && c.id === chosenId),
            }));
            // 実際に選択されたトークンが上位候補に含まれない場合は追加
            if (!probs.some(p => p.chosen)) {
              probs.push({
                tok_str: cp.token ?? content,
                prob: cp.logprob != null ? Math.exp(cp.logprob) : 0,
                chosen: true,
              });
            }
            probs.sort((a, b) => b.prob - a.prob);
          }

          if (content !== '') {
            outputEl.appendChild(makeToken(content, probs));
            tokenCount++;
            if (isSpecialToken(content)) specialCount++;
          }

          if (data.stop) break outer;
        }
      }

      setStatus(`完了 — ${tokenCount} トークン生成`
        + (specialCount > 0 ? `（うち special token ${specialCount}）` : '')
        + (special ? '' : ' / special token は非表示'));

    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('停止しました');
      } else {
        setStatus(`エラー: ${err.message}`, true);
        console.error(err);
      }
    } finally {
      setGenerating(false);
    }
  }

  // モデル一覧と special token をまとめて取得（ステータス表示が競合しないよう順番に）
  async function refreshServerInfo() {
    await loadModels();
    await loadSpecialTokens();
  }

  document.getElementById('generateBtn').addEventListener('click', handleGenerate);
  document.getElementById('clearBtn').addEventListener('click', clearOutput);
  document.getElementById('refreshModelsBtn').addEventListener('click', loadModels);
  document.getElementById('refreshSpecialBtn').addEventListener('click', e => {
    e.preventDefault();     // summary 内のボタンで開閉させない
    loadSpecialTokens();
  });
  document.getElementById('tokenizeBtn').addEventListener('click', tokenizePrompt);
  document.getElementById('specialOutput').addEventListener('change', updateSpecialBadge);
  document.getElementById('prompt').addEventListener('input', updateSpecialBadge);

  // Server URL 変更時にモデル一覧と special token を再取得
  document.getElementById('serverUrl').addEventListener('change', refreshServerInfo);

  // 初回ロード
  renderBiasControls();
  renderSpecialChips();
  updateSpecialBadge();
  refreshServerInfo();

  document.getElementById('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleGenerate();
    }
  });
</script>
</body>
