<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Confidence Viewer</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface2: #f1f3f5;
      --text: #1f2430;
      --text-dim: #6b7280;
      --accent: #2563eb;
      --accent-dim: #dbeafe;
      --border: #e3e6ec;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 40px;
    }

    .page-header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    select { cursor: pointer; height: 36px; }

    .icon-btn {
      flex: 0 0 auto;
      padding: 0;
      width: 36px;
      height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 6px;
    }
    .icon-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea { resize: vertical; }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .row .field { flex: 1; min-width: 90px; }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }
    button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      transition: opacity 0.15s, background 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #generateBtn {
      background: var(--accent);
      color: #fff;
    }
    #generateBtn.stopping {
      background: var(--danger);
      color: #fff;
    }
    #clearBtn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .hint {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* Character-class bias */
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .card-note {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-dim);
      margin-left: 8px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 折りたたみ（既定は閉じた状態） */
    .bias-card { padding: 0; }
    .bias-card > summary {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      list-style: none;
      border-radius: 10px;
    }
    .bias-card > summary::-webkit-details-marker { display: none; }
    .bias-card > summary::before {
      content: '▶';
      flex: 0 0 auto;
      margin-right: 8px;
      font-size: 0.6rem;
      color: var(--text-dim);
      transition: transform 0.15s;
    }
    .bias-card[open] > summary::before { transform: rotate(90deg); }
    .bias-card > summary:hover { background: var(--surface2); }
    .bias-card > summary:focus-visible { outline: 2px solid var(--accent); }
    .bias-card[open] > summary {
      border-bottom: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
    }
    .bias-body { padding: 4px 18px 18px; }

    /* 折りたたみ中でも適用状況がわかるバッジ */
    .bias-badge {
      margin-left: auto;
      flex: 0 0 auto;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      white-space: nowrap;
    }
    .bias-badge:empty { display: none; }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 14px;
    }
    .preset {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
    }
    .preset.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .preset.reset { margin-left: auto; }

    .bias-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }
    .bias-name {
      flex: 0 0 130px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .bias-name .bias-count {
      display: block;
      font-size: 0.66rem;
      color: var(--text-dim);
    }
    .bias-slider {
      flex: 1;
      min-width: 110px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .bias-value {
      flex: 0 0 52px;
      font-family: monospace;
      font-size: 0.8rem;
      text-align: right;
      color: var(--text-dim);
    }
    .bias-value.up   { color: #15803d; font-weight: 700; }
    .bias-value.down { color: var(--danger); font-weight: 700; }

    .bias-summary {
      margin-top: 10px;
      font-size: 0.74rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* Output area */
    #output {
      font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
      font-size: 0.95rem;
      line-height: 2.1;
      word-break: break-word;
      min-height: 80px;
    }

    #status {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-dim);
      min-height: 1.2em;
    }
    #status.error { color: var(--danger); }

    /* Token spans */
    .tok {
      display: inline;
      color: var(--text);
      border-radius: 4px;
      padding: 1px 2px;
      cursor: default;
      transition: filter 0.1s;
      white-space: pre-wrap;
    }
    .tok:hover { filter: brightness(0.93); }
    .tok.no-prob {
      background: transparent;
      color: var(--text-dim);
    }

    /* Newline visual marker */
    .tok-nl::after {
      content: '↵';
      font-size: 0.7em;
      opacity: 0.6;
      margin-right: 1px;
    }

    /* Legend */
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .legend-bar {
      flex: 1;
      max-width: 200px;
      height: 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: linear-gradient(to right,
        hsl(0,68%,90%),
        hsl(30,68%,87%),
        hsl(60,68%,85%),
        hsl(90,68%,82%),
        hsl(120,68%,78%)
      );
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      z-index: 9999;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      pointer-events: none;
      min-width: 220px;
      max-width: 320px;
      box-shadow: 0 8px 28px rgba(15,23,42,0.14);
      font-size: 0.83rem;
    }
    #tooltip.hidden { display: none; }

    .tt-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .tt-token {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 11px;
      word-break: break-all;
    }
    .tt-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }
    .tt-row:last-child { margin-bottom: 0; }
    .tt-tok {
      font-family: monospace;
      font-size: 0.8rem;
      min-width: 72px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .tt-row.chosen .tt-tok {
      font-weight: 700;
      color: var(--accent);
    }
    .tt-bar-wrap {
      flex: 1;
      height: 10px;
      background: var(--surface2);
      border-radius: 5px;
      overflow: hidden;
    }
    .tt-bar {
      height: 100%;
      border-radius: 5px;
      transition: width 0.1s;
    }
    .tt-pct {
      font-size: 0.77rem;
      color: var(--text-dim);
      min-width: 38px;
      text-align: right;
    }
    .tt-row.chosen .tt-pct { color: var(--text); font-weight: 600; }

    .tt-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    @media (max-width: 580px) {
      body { padding: 14px 14px 32px; }
      .row { flex-direction: column; }
      .hint { display: none; }
      .card-note { display: none; }
      .bias-name { flex-basis: 96px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>Token Confidence Viewer</h1>
  <div class="subtitle">llama-server の n_probs でトークンごとの信頼度をヒートマップ表示</div>
</div>

<div class="card">
  <div class="row">
    <div class="field" style="flex:2">
      <label>Server URL</label>
      <input type="text" id="serverUrl" value="http://localhost:8080" spellcheck="false">
    </div>
    <div class="field" style="flex:3">
      <label>Model</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="model" style="flex:1"></select>
        <button id="refreshModelsBtn" type="button" class="icon-btn" title="モデル一覧を再取得">⟳</button>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Prompt <span style="text-transform:none;font-weight:400;letter-spacing:0">(Ctrl+Enter で生成)</span></label>
    <textarea id="prompt" rows="4" placeholder="プロンプトを入力...">昔々あるところに</textarea>
  </div>
  <div class="row">
    <div class="field">
      <label>n_predict</label>
      <input type="number" id="nPredict" value="200" min="1" max="4096">
    </div>
    <div class="field">
      <label>n_probs (候補数)</label>
      <input type="number" id="nProbs" value="5" min="1" max="40">
    </div>
    <div class="field">
      <label>Temperature</label>
      <input type="number" id="temperature" value="0.8" min="0" max="2" step="0.05">
    </div>
  </div>
  <div class="btn-row">
    <button id="generateBtn">Generate</button>
    <button id="clearBtn">Clear</button>
    <span class="hint">CORS設定が必要な場合: <code>--cors-allow-origins "*"</code></span>
  </div>
</div>

<details class="card bias-card" id="biasCard">
  <summary class="card-title">文字種バイアス<span class="card-note">logit_bias で出やすさを調整（確率 0 にはしません）</span><span class="bias-badge" id="biasBadge"></span></summary>
  <div class="bias-body">
    <div class="preset-row" id="presetRow"></div>
    <div id="biasControls"></div>
    <div class="bias-summary" id="biasSummary"></div>
  </div>
</details>

<div class="card">
  <div id="output"></div>
  <div id="status"></div>
</div>

<div class="legend">
  <span>低信頼</span>
  <div class="legend-bar"></div>
  <span>高信頼</span>
</div>

<div id="tooltip" class="hidden"></div>

<script>
  let abortController = null;
  let generating = false;

  // --- Model list ---
  function currentServerUrl() {
    return document.getElementById('serverUrl').value.trim().replace(/\/+$/, '');
  }

  async function loadModels() {
    const serverUrl = currentServerUrl();
    const select = document.getElementById('model');
    const btn = document.getElementById('refreshModelsBtn');
    const prev = select.value;
    btn.classList.add('spinning');
    try {
      const res = await fetch(`${serverUrl}/v1/models`);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      const ids = (data.data || []).map(m => m.id).filter(Boolean);
      if (ids.length === 0) throw new Error('モデルが返されませんでした');

      select.innerHTML = '';
      ids.forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      });
      // 以前の選択を復元（存在すれば）
      if (ids.includes(prev)) select.value = prev;
      setStatus(`モデル ${ids.length} 件を取得`);
    } catch (err) {
      select.innerHTML = '';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '取得失敗';
      select.appendChild(opt);
      setStatus(`モデル一覧の取得に失敗: ${err.message}`, true);
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // --- Color helpers ---
  function probToHsl(prob) {
    const hue = prob * 120; // 0=赤(低信頼) → 120=緑(高信頼)
    const light = 93 - prob * 15; // 低信頼=淡く(93%)、高信頼=やや濃く(78%)
    return `hsl(${hue.toFixed(1)}, 68%, ${light.toFixed(1)}%)`;
  }

  // --- HTML escaping ---
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Render token string for display (show repr of whitespace/control chars)
  function displayStr(s) {
    return JSON.stringify(s).slice(1, -1); // strip surrounding quotes
  }

  // --- Token DOM element ---
  function makeToken(content, probs) {
    // probs: [{tok_str, prob, chosen}, ...] 確率降順。chosen=実際に選ばれたトークン
    const chosen = probs && probs.find(p => p.chosen);
    const chosenProb = chosen ? chosen.prob
                     : ((probs && probs.length > 0) ? probs[0].prob : null);

    const span = document.createElement('span');
    span.className = 'tok';

    if (chosenProb !== null) {
      span.style.backgroundColor = probToHsl(chosenProb);
      // 文字色は常に濃色で固定（淡い背景でも読みやすく）
    } else {
      span.classList.add('no-prob');
    }

    // Visual newline marker
    const hasNewline = content.includes('\n');
    if (hasNewline) span.classList.add('tok-nl');

    span.textContent = content;
    span.dataset.probs = JSON.stringify(probs || []);
    span.dataset.content = content;

    span.addEventListener('mouseenter', onTokenEnter);
    span.addEventListener('mouseleave', onTokenLeave);
    span.addEventListener('mousemove', onTokenMove);

    return span;
  }

  // --- Tooltip ---
  const tooltip = document.getElementById('tooltip');
  let lastMouseX = 0, lastMouseY = 0;

  function onTokenEnter(e) {
    const probs = JSON.parse(e.currentTarget.dataset.probs || '[]');
    const content = e.currentTarget.dataset.content;
    if (!probs.length) return;

    const maxProb = Math.max(...probs.map(p => p.prob));

    let html = `<div class="tt-label">選択されたトークン</div>`;
    html += `<div class="tt-token">${esc(displayStr(content))}</div>`;
    html += `<div class="tt-divider"></div>`;
    html += `<div class="tt-label">上位候補</div>`;

    probs.forEach((p) => {
      const barW = maxProb > 0 ? (p.prob / maxProb * 100).toFixed(1) : 0;
      const pct = (p.prob * 100).toFixed(2);
      const color = probToHsl(p.prob);
      const chosen = p.chosen ? 'chosen' : '';
      const mark = p.chosen ? ' ✓' : '';
      html += `
        <div class="tt-row ${chosen}">
          <span class="tt-tok" title="${esc(displayStr(p.tok_str))}">${esc(displayStr(p.tok_str))}${mark}</span>
          <div class="tt-bar-wrap">
            <div class="tt-bar" style="width:${barW}%;background:${color}"></div>
          </div>
          <span class="tt-pct">${pct}%</span>
        </div>`;
    });

    tooltip.innerHTML = html;
    tooltip.classList.remove('hidden');
    positionTooltip(e.clientX, e.clientY);
  }

  function onTokenLeave() {
    tooltip.classList.add('hidden');
  }

  function onTokenMove(e) {
    positionTooltip(e.clientX, e.clientY);
  }

  function positionTooltip(cx, cy) {
    const m = 14;
    const tw = tooltip.offsetWidth || 240;
    const th = tooltip.offsetHeight || 160;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let x = cx + m;
    let y = cy + m;
    if (x + tw > vw - m) x = cx - tw - m;
    if (y + th > vh - m) y = cy - th - m;
    if (x < m) x = m;
    if (y < m) y = m;

    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }

  // --- 文字種バイアス (logit_bias) ---
  // llama-server の logit_bias は [文字列, バイアス] を受け取り、文字列を
  // トークナイズした各トークンにバイアスを加算する。
  // -Infinity / false（＝禁止）は使わないので、確率が 0 になることはない。

  function codeRange(from, to) {
    let out = '';
    for (let c = from; c <= to; c++) out += String.fromCodePoint(c);
    return out;
  }

  const HIRAGANA = codeRange(0x3041, 0x3096) + 'ゝゞ';
  const KATAKANA = codeRange(0x30A1, 0x30FA) + 'ーヽヾ';
  const LATIN    = 'abcdefghijklmnopqrstuvwxyz'
                 + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
                 + '0123456789';

  // 日本語では使われない（または日本語表記が明確に別字体の）中国語文字。
  // 主に簡体字と中国語特有の機能語。
  const CHINESE_ONLY =
    // 機能語・代名詞
      '这那哪么什怎谁你们咱吗呢吧嘛啥哦嗯'
    // 言（讠）
    + '认订讥讨让讪训议讯记讲论讼讽设访诀证评识诉诊词译试诗诚话诞询该详语误说'
    + '请诸读诺调谈谊谋谍谎谐谓谜谢谣谨谱谴'
    // 貝（贝）
    + '贝贞负贡财责贤败货质贩贪贫购贯贵贷贸费贺贼资赂赋赌赏赐赔赖赚赞赠赢赃赡'
    // 車（车）
    + '车轨转轮软轰轻载较辅辆辈辉输辑辖'
    // 金（钅）
    + '钉钓钟钢钥钱钻铁铃铜银铺链销锁锅锋错锦锐键镇镜针钞钙铅铝铭铸'
    // 門（门）
    + '门闭闯闲闷闻阀阁阅阐闹阔'
    // 阜（阝）
    + '队阳阴阵阶际陆陈险随隐邓邮郑邻'
    // 頁・風・飛・食・馬・鳥・魚
    + '页顶项顺须顾预领颁颂频颖颗题颜额颤风飘飞饥饭饮饰饱饼饶馆馈'
    + '驱驰驶驾骑验骄骗骤骏鸟鸡鸣鸿鹅鹏鹤鸭鹰鱼鲁鲜鲍鲸'
    // 糸（纟）
    + '级纪红约纯纲纳纵纷纸纹线练组细织终绍经绑绒结绕绘给络绝统绞继绣绩绪续'
    + '绳维绵综绿缓编缘缝缠缩缴纠纤'
    // その他の常用簡体字
    + '个们时说发经过还后样种进话觉动开关问间语读听买卖东马龙无义乐书长员见'
    + '观习电爱为从众让该于现实对导岁岛币师帮广库庆废张强归录忆态总恶惊惯愿'
    + '战户扬敌显晓术权极构标桥检欢历气汉汤沟泪泽洁济测渐满滨灭灵烧热爷环疗应'
    + '盘监盖矿码硕确础祸离积稳穷竞笔简签篮类粮紧罗罚罢联聪职肃肠肤肿胜脏脑'
    + '腾舰艺节苏苹荐药荣获营蓝虑虽补规变边达迁运远违连迟适选逊递遗酿释齐齿网'
    + '亚产亿仅仓价优伟传伤伦侦侧俭债倾偿储兰兴养兽冈军农冲决况冻净凉减凤凭'
    + '刘则刚创删剧劝办务劳势勋华协单卫厂厅厉压厌县叹吓吨呜响唤啸喷园围图圣'
    + '坏块坛坟坠垒墙壳壶处备复够头夹夺奖妈妇娱婴孙审宫宽宾寻尔尘尝层屿岂岗'
    + '岭帘帜带庄庐庙弃弯弹彻忧怀怜恳恼惩惭惧愤戏扑扫扩抚拟择拥挂挡挤损捡掷'
    + '摆摇团机杀杂杨柜栏树档梦毁毕汇泼洒浇浊浓涂涛润涩渊渔溃滤澜灿炼烂烛烦'
    + '焕犹狱狮猎玛玺琐琼皱盐睁瞒矫砖砚竖笃笼筛筹箩篓粪聋胀胶';

  // 中国語専用文字だけで構成された語。トークナイザが複数文字を 1 トークンに
  // まとめる場合に効かせるための追加エントリ（1 文字でも捕まえられない分を補う）。
  const CHINESE_ONLY_WORDS = [
    '这个', '什么', '怎么', '这样', '那样', '时间', '问题', '认为', '说话',
    '关于', '应该', '经过', '电话', '语言', '长时间', '无论', '义务', '观点',
    '现实', '实现', '对话', '简单', '经济', '网络', '电脑', '开关', '见过',
  ];

  // 日本語でよく使う漢字（常用漢字を中心とした頻出字）。
  const KANJI_COMMON =
      '一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手'
    + '十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年'
    + '白八百文木本名目立力林六'
    + '引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄'
    + '形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙'
    + '寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体'
    + '台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父'
    + '風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話'
    + '悪安暗医委意育員院飲運泳駅央横屋温化荷界開階寒感漢館岸起期客究急級宮'
    + '球去橋業曲局銀区苦具君係軽血決研県庫湖向幸港号根祭皿仕死使始指歯詩次'
    + '事持式実写者主守取酒受州拾終習集住重宿所暑助昭消商章勝乗植申身神真深'
    + '進世整昔全相送想息速族他打対待代第題炭短談着注柱丁帳調追定庭笛鉄転都'
    + '度投豆島湯登等動童農波配倍箱畑発反坂板皮悲美鼻筆氷表秒病品負部服福物'
    + '平返勉放味命面問役薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和'
    + '愛案以衣位囲胃印英栄塩億加果貨課芽改械害街各覚完官管関観願希季紀喜旗'
    + '器機議求泣救給挙漁共協鏡競極訓軍郡径型景芸欠結建健験固功好候航康告差'
    + '菜最材昨札刷殺察参産散残士氏史司試児治辞失借種周祝順初松笑唱焼象照賞'
    + '臣信成省清静席積折節説浅戦選然争倉巣束側続卒孫帯隊達単置仲貯兆腸低底'
    + '停的典伝徒努灯堂働特得毒熱念敗梅博飯飛費必票標不夫付府副粉兵別辺変便'
    + '包法望牧末満未脈民無約勇要養浴利陸良料量輪類令冷例歴連老労録'
    + '圧移因永営衛易益液演応往桜恩仮価河過賀快解格確額刊幹慣眼基寄規技義逆'
    + '久旧居許境均禁句群経潔件券険検限現減故個護効厚耕鉱構興講混査再災妻採'
    + '際在財罪雑酸賛支志枝師資飼示似識質舎謝授修述術準序招承証条状常情織職'
    + '制性政勢精製税責績接設絶祖素総造像増則測属率損退貸態団断築張提程適統'
    + '銅導徳独任燃能破犯判版比肥非備俵評貧布婦富武復複仏編弁保墓報豊防貿暴'
    + '務夢迷綿輸余預容略留領'
    + '異遺域宇映延沿我灰拡革閣割株干巻看簡危貴疑吸供胸郷勤筋系敬警劇激穴絹'
    + '権憲源厳己呼誤孝皇紅降鋼刻穀骨困砂座済裁策冊蚕至私姿視詞誌磁射捨尺若'
    + '樹収宗就衆従縦縮熟純処署諸除将傷障城蒸針仁垂推寸盛聖誠宣専泉洗染銭善'
    + '奏窓創装層操蔵臓存尊宅担探誕段暖値宙忠著庁頂潮賃痛敵展討党糖届難乳認'
    + '納脳派拝背肺俳班晩否批秘腹奮並陛閉片補暮宝訪亡忘棒枚幕密盟模訳郵優幼'
    + '欲翌乱卵覧裏律臨朗論';

  const uniq = str => Array.from(new Set(Array.from(str)));

  const chineseOnlySet = new Set(Array.from(CHINESE_ONLY));

  // 中国語専用に分類した字は「漢字（日本語）」から除外し、両方のバイアスが
  // 二重にかからないようにする。
  const kanjiChars = uniq(KANJI_COMMON).filter(ch => !chineseOnlySet.has(ch));

  // 全文字が中国語専用集合に含まれる語だけを採用（日本語漢字への巻き添えを防ぐ）
  const chineseWords = CHINESE_ONLY_WORDS.filter(
    w => Array.from(w).every(ch => chineseOnlySet.has(ch))
  );

  const BIAS_LIMIT = 5;   // これ以上は上げ下げしない（-Infinity は使わない）
  const BIAS_STEP  = 0.25;

  const BIAS_CLASSES = [
    { key: 'hira',  label: 'ひらがな',        entries: uniq(HIRAGANA) },
    { key: 'kata',  label: 'カタカナ',        entries: uniq(KATAKANA) },
    { key: 'kanji', label: '漢字（日本語）',  entries: kanjiChars },
    { key: 'zh',    label: '中国語専用文字',  entries: Array.from(chineseOnlySet).concat(chineseWords) },
    { key: 'latin', label: 'ラテン文字・数字', entries: uniq(LATIN) },
  ];

  const PRESETS = [
    { id: 'zh-down',    label: '中国語文字を減らす', values: { zh:    -3   } },
    { id: 'hira-up',    label: 'ひらがなを増やす',   values: { hira:   1.5 } },
    { id: 'kata-up',    label: 'カタカナを増やす',   values: { kata:   1.5 } },
    { id: 'kanji-down', label: '漢字を減らす',       values: { kanji: -1.5 } },
    { id: 'latin-down', label: '英数字を減らす',     values: { latin: -2   } },
  ];

  const biasValues = {};
  BIAS_CLASSES.forEach(c => { biasValues[c.key] = 0; });

  function clampBias(v) {
    if (!isFinite(v)) return 0;
    return Math.max(-BIAS_LIMIT, Math.min(BIAS_LIMIT, v));
  }

  function renderBiasControls() {
    const presetRow = document.getElementById('presetRow');
    presetRow.innerHTML = '';
    PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset';
      btn.dataset.presetId = preset.id;
      btn.textContent = preset.label;
      btn.title = Object.entries(preset.values)
        .map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ')
        + '（もう一度押すと解除）';
      btn.addEventListener('click', () => togglePreset(preset));
      presetRow.appendChild(btn);
    });

    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'preset reset';
    resetBtn.textContent = 'リセット';
    resetBtn.addEventListener('click', () => {
      BIAS_CLASSES.forEach(c => { biasValues[c.key] = 0; });
      syncBiasUI();
    });
    presetRow.appendChild(resetBtn);

    const wrap = document.getElementById('biasControls');
    wrap.innerHTML = '';
    BIAS_CLASSES.forEach(cls => {
      const row = document.createElement('div');
      row.className = 'bias-row';

      const name = document.createElement('div');
      name.className = 'bias-name';
      name.innerHTML = `${esc(cls.label)}<span class="bias-count">${cls.entries.length} 項目</span>`;

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'bias-slider';
      slider.min = String(-BIAS_LIMIT);
      slider.max = String(BIAS_LIMIT);
      slider.step = String(BIAS_STEP);
      slider.value = '0';
      slider.dataset.key = cls.key;
      slider.addEventListener('input', () => {
        biasValues[cls.key] = clampBias(parseFloat(slider.value));
        syncBiasUI();
      });

      const val = document.createElement('span');
      val.className = 'bias-value';
      val.dataset.key = cls.key;

      row.appendChild(name);
      row.appendChild(slider);
      row.appendChild(val);
      wrap.appendChild(row);
    });

    syncBiasUI();
  }

  // プリセットは押すたびに「適用 ⇄ 解除」を切り替える
  function togglePreset(preset) {
    const alreadyOn = Object.entries(preset.values)
      .every(([k, v]) => Math.abs(biasValues[k] - v) < 1e-6);
    Object.entries(preset.values).forEach(([k, v]) => {
      biasValues[k] = alreadyOn ? 0 : clampBias(v);
    });
    syncBiasUI();
  }

  function syncBiasUI() {
    BIAS_CLASSES.forEach(cls => {
      const v = biasValues[cls.key];
      const slider = document.querySelector(`.bias-slider[data-key="${cls.key}"]`);
      const val    = document.querySelector(`.bias-value[data-key="${cls.key}"]`);
      if (slider) slider.value = String(v);
      if (val) {
        val.textContent = `${v > 0 ? '+' : ''}${v.toFixed(2)}`;
        val.className = 'bias-value' + (v > 0 ? ' up' : v < 0 ? ' down' : '');
      }
    });

    document.querySelectorAll('.preset[data-preset-id]').forEach(btn => {
      const preset = PRESETS.find(p => p.id === btn.dataset.presetId);
      const on = preset && Object.entries(preset.values)
        .every(([k, v]) => Math.abs(biasValues[k] - v) < 1e-6);
      btn.classList.toggle('active', !!on);
    });

    const active = BIAS_CLASSES.filter(c => biasValues[c.key] !== 0);
    const summary = document.getElementById('biasSummary');

    // 折りたたんでいても適用中かどうかが見えるようにヘッダへ表示
    const badge = document.getElementById('biasBadge');
    badge.textContent = active.length === 0 ? '' : `${active.length} 種類 適用中`;
    badge.title = active.length === 0 ? '' : active
      .map(c => `${c.label} ${biasValues[c.key] > 0 ? '+' : ''}${biasValues[c.key].toFixed(2)}`)
      .join(' / ');
    if (active.length === 0) {
      summary.textContent = 'バイアスなし（logit_bias は送信しません）。';
    } else {
      const total = active.reduce((n, c) => n + c.entries.length, 0);
      const parts = active.map(c => {
        const v = biasValues[c.key];
        return `${c.label} ${v > 0 ? '+' : ''}${v.toFixed(2)}`;
      });
      summary.textContent =
        `適用中: ${parts.join(' / ')} — logit_bias ${total} 件を送信。`
        + ' プラスで出やすく、マイナスで出にくくなります（0 にはなりません）。';
    }
  }

  // リクエスト用の logit_bias を組み立てる
  function buildLogitBias() {
    const out = [];
    BIAS_CLASSES.forEach(cls => {
      const v = clampBias(biasValues[cls.key]);
      if (Math.abs(v) < 1e-6) return;
      cls.entries.forEach(entry => out.push([entry, v]));
    });
    return out;
  }

  // --- Generate ---
  function setGenerating(v) {
    generating = v;
    const btn = document.getElementById('generateBtn');
    if (v) {
      btn.textContent = 'Stop';
      btn.classList.add('stopping');
    } else {
      btn.textContent = 'Generate';
      btn.classList.remove('stopping');
    }
    document.getElementById('clearBtn').disabled = v;
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function clearOutput() {
    document.getElementById('output').innerHTML = '';
    setStatus('');
  }

  async function handleGenerate() {
    if (generating) {
      abortController?.abort();
      return;
    }

    const serverUrl = currentServerUrl();
    const model     = document.getElementById('model').value;
    const prompt    = document.getElementById('prompt').value;
    const nPredict  = parseInt(document.getElementById('nPredict').value) || 200;
    const nProbs    = parseInt(document.getElementById('nProbs').value) || 5;
    const temp      = parseFloat(document.getElementById('temperature').value);
    const logitBias = buildLogitBias();

    clearOutput();
    setGenerating(true);
    setStatus('接続中...');

    abortController = new AbortController();
    const outputEl = document.getElementById('output');

    try {
      const res = await fetch(`${serverUrl}/completion`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          n_predict: nPredict,
          n_probs:   nProbs,
          temperature: isNaN(temp) ? 0.8 : temp,
          stream: true,
          ...(logitBias.length > 0 ? { logit_bias: logitBias } : {}),
          ...(model ? { model } : {}),
        }),
        signal: abortController.signal,
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }

      setStatus('生成中...');

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let tokenCount = 0;
      let stopped = false;

      outer: while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });

        let nl;
        while ((nl = buf.indexOf('\n')) !== -1) {
          const line = buf.slice(0, nl).trimEnd();
          buf = buf.slice(nl + 1);

          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') { stopped = true; break outer; }

          let data;
          try { data = JSON.parse(raw); } catch { continue; }

          if (data.stop) { stopped = true; break outer; }

          const content = data.content ?? '';
          let probs = [];
          if (Array.isArray(data.completion_probabilities) && data.completion_probabilities.length > 0) {
            const cp = data.completion_probabilities[0];
            // 新しい llama-server は top_logprobs(token/logprob)、旧版は probs(tok_str/prob)
            const cands = cp.top_logprobs ?? cp.probs ?? [];
            const chosenId = cp.id;
            probs = cands.map(c => ({
              tok_str: c.token ?? c.tok_str ?? '',
              prob: c.prob != null ? c.prob
                  : (c.logprob != null ? Math.exp(c.logprob) : 0),
              chosen: (chosenId != null && c.id === chosenId),
            }));
            // 実際に選択されたトークンが上位候補に含まれない場合は追加
            if (!probs.some(p => p.chosen)) {
              probs.push({
                tok_str: cp.token ?? content,
                prob: cp.logprob != null ? Math.exp(cp.logprob) : 0,
                chosen: true,
              });
            }
            probs.sort((a, b) => b.prob - a.prob);
          }

          if (content !== '') {
            outputEl.appendChild(makeToken(content, probs));
            tokenCount++;
          }
        }
      }

      setStatus(`完了 — ${tokenCount} トークン生成`);

    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('停止しました');
      } else {
        setStatus(`エラー: ${err.message}`, true);
        console.error(err);
      }
    } finally {
      setGenerating(false);
    }
  }

  document.getElementById('generateBtn').addEventListener('click', handleGenerate);
  document.getElementById('clearBtn').addEventListener('click', clearOutput);
  document.getElementById('refreshModelsBtn').addEventListener('click', loadModels);
  // Server URL 変更時に一覧を再取得
  document.getElementById('serverUrl').addEventListener('change', loadModels);
  // 初回ロード
  renderBiasControls();
  loadModels();

  document.getElementById('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleGenerate();
    }
  });
</script>
