<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Confidence Viewer</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface2: #f1f3f5;
      --text: #1f2430;
      --text-dim: #6b7280;
      --accent: #2563eb;
      --accent-dim: #dbeafe;
      --border: #e3e6ec;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 40px;
    }

    .page-header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    select { cursor: pointer; height: 36px; }

    .icon-btn {
      flex: 0 0 auto;
      padding: 0;
      width: 36px;
      height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 6px;
    }
    .icon-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea { resize: vertical; }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .row .field { flex: 1; min-width: 90px; }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }
    button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      transition: opacity 0.15s, background 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #generateBtn {
      background: var(--accent);
      color: #fff;
    }
    #generateBtn.stopping {
      background: var(--danger);
      color: #fff;
    }
    #clearBtn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .hint {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* Output area */
    #output {
      font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
      font-size: 0.95rem;
      line-height: 2.1;
      word-break: break-word;
      min-height: 80px;
    }

    #status {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-dim);
      min-height: 1.2em;
    }
    #status.error { color: var(--danger); }

    /* Token spans */
    .tok {
      display: inline;
      color: var(--text);
      border-radius: 4px;
      padding: 1px 2px;
      cursor: default;
      transition: filter 0.1s;
      white-space: pre-wrap;
    }
    .tok:hover { filter: brightness(0.93); }
    .tok.no-prob {
      background: transparent;
      color: var(--text-dim);
    }

    /* Newline visual marker */
    .tok-nl::after {
      content: '↵';
      font-size: 0.7em;
      opacity: 0.6;
      margin-right: 1px;
    }

    /* Legend */
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .legend-bar {
      flex: 1;
      max-width: 200px;
      height: 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: linear-gradient(to right,
        hsl(0,68%,90%),
        hsl(30,68%,87%),
        hsl(60,68%,85%),
        hsl(90,68%,82%),
        hsl(120,68%,78%)
      );
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      z-index: 9999;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      pointer-events: none;
      min-width: 220px;
      max-width: 320px;
      box-shadow: 0 8px 28px rgba(15,23,42,0.14);
      font-size: 0.83rem;
    }
    #tooltip.hidden { display: none; }

    .tt-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .tt-token {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 11px;
      word-break: break-all;
    }
    .tt-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }
    .tt-row:last-child { margin-bottom: 0; }
    .tt-tok {
      font-family: monospace;
      font-size: 0.8rem;
      min-width: 72px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .tt-row.chosen .tt-tok {
      font-weight: 700;
      color: var(--accent);
    }
    .tt-bar-wrap {
      flex: 1;
      height: 10px;
      background: var(--surface2);
      border-radius: 5px;
      overflow: hidden;
    }
    .tt-bar {
      height: 100%;
      border-radius: 5px;
      transition: width 0.1s;
    }
    .tt-pct {
      font-size: 0.77rem;
      color: var(--text-dim);
      min-width: 38px;
      text-align: right;
    }
    .tt-row.chosen .tt-pct { color: var(--text); font-weight: 600; }

    .tt-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    @media (max-width: 580px) {
      body { padding: 14px 14px 32px; }
      .row { flex-direction: column; }
      .hint { display: none; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>Token Confidence Viewer</h1>
  <div class="subtitle">llama-server の n_probs でトークンごとの信頼度をヒートマップ表示</div>
</div>

<div class="card">
  <div class="row">
    <div class="field" style="flex:2">
      <label>Server URL</label>
      <input type="text" id="serverUrl" value="http://localhost:41434" spellcheck="false">
    </div>
    <div class="field" style="flex:3">
      <label>Model</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="model" style="flex:1"></select>
        <button id="refreshModelsBtn" type="button" class="icon-btn" title="モデル一覧を再取得">⟳</button>
      </div>
    </div>
  </div>
  <div class="field">
    <label>Prompt <span style="text-transform:none;font-weight:400;letter-spacing:0">(Ctrl+Enter で生成)</span></label>
    <textarea id="prompt" rows="4" placeholder="プロンプトを入力...">昔々あるところに</textarea>
  </div>
  <div class="row">
    <div class="field">
      <label>n_predict</label>
      <input type="number" id="nPredict" value="200" min="1" max="4096">
    </div>
    <div class="field">
      <label>n_probs (候補数)</label>
      <input type="number" id="nProbs" value="5" min="1" max="40">
    </div>
    <div class="field">
      <label>Temperature</label>
      <input type="number" id="temperature" value="0.8" min="0" max="2" step="0.05">
    </div>
  </div>
  <div class="btn-row">
    <button id="generateBtn">Generate</button>
    <button id="clearBtn">Clear</button>
    <span class="hint">CORS設定が必要な場合: <code>--cors-allow-origins "*"</code></span>
  </div>
</div>

<div class="card">
  <div id="output"></div>
  <div id="status"></div>
</div>

<div class="legend">
  <span>低信頼</span>
  <div class="legend-bar"></div>
  <span>高信頼</span>
</div>

<div id="tooltip" class="hidden"></div>

<script>
  let abortController = null;
  let generating = false;

  // --- Model list ---
  function currentServerUrl() {
    return document.getElementById('serverUrl').value.trim().replace(/\/+$/, '');
  }

  async function loadModels() {
    const serverUrl = currentServerUrl();
    const select = document.getElementById('model');
    const btn = document.getElementById('refreshModelsBtn');
    const prev = select.value;
    btn.classList.add('spinning');
    try {
      const res = await fetch(`${serverUrl}/v1/models`);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      const ids = (data.data || []).map(m => m.id).filter(Boolean);
      if (ids.length === 0) throw new Error('モデルが返されませんでした');

      select.innerHTML = '';
      ids.forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      });
      // 以前の選択を復元（存在すれば）
      if (ids.includes(prev)) select.value = prev;
      setStatus(`モデル ${ids.length} 件を取得`);
    } catch (err) {
      select.innerHTML = '';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '取得失敗';
      select.appendChild(opt);
      setStatus(`モデル一覧の取得に失敗: ${err.message}`, true);
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // --- Color helpers ---
  function probToHsl(prob) {
    const hue = prob * 120; // 0=赤(低信頼) → 120=緑(高信頼)
    const light = 93 - prob * 15; // 低信頼=淡く(93%)、高信頼=やや濃く(78%)
    return `hsl(${hue.toFixed(1)}, 68%, ${light.toFixed(1)}%)`;
  }

  // --- HTML escaping ---
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Render token string for display (show repr of whitespace/control chars)
  function displayStr(s) {
    return JSON.stringify(s).slice(1, -1); // strip surrounding quotes
  }

  // --- Token DOM element ---
  function makeToken(content, probs) {
    // probs: [{tok_str, prob, chosen}, ...] 確率降順。chosen=実際に選ばれたトークン
    const chosen = probs && probs.find(p => p.chosen);
    const chosenProb = chosen ? chosen.prob
                     : ((probs && probs.length > 0) ? probs[0].prob : null);

    const span = document.createElement('span');
    span.className = 'tok';

    if (chosenProb !== null) {
      span.style.backgroundColor = probToHsl(chosenProb);
      // 文字色は常に濃色で固定（淡い背景でも読みやすく）
    } else {
      span.classList.add('no-prob');
    }

    // Visual newline marker
    const hasNewline = content.includes('\n');
    if (hasNewline) span.classList.add('tok-nl');

    span.textContent = content;
    span.dataset.probs = JSON.stringify(probs || []);
    span.dataset.content = content;

    span.addEventListener('mouseenter', onTokenEnter);
    span.addEventListener('mouseleave', onTokenLeave);
    span.addEventListener('mousemove', onTokenMove);

    return span;
  }

  // --- Tooltip ---
  const tooltip = document.getElementById('tooltip');
  let lastMouseX = 0, lastMouseY = 0;

  function onTokenEnter(e) {
    const probs = JSON.parse(e.currentTarget.dataset.probs || '[]');
    const content = e.currentTarget.dataset.content;
    if (!probs.length) return;

    const maxProb = Math.max(...probs.map(p => p.prob));

    let html = `<div class="tt-label">選択されたトークン</div>`;
    html += `<div class="tt-token">${esc(displayStr(content))}</div>`;
    html += `<div class="tt-divider"></div>`;
    html += `<div class="tt-label">上位候補</div>`;

    probs.forEach((p) => {
      const barW = maxProb > 0 ? (p.prob / maxProb * 100).toFixed(1) : 0;
      const pct = (p.prob * 100).toFixed(2);
      const color = probToHsl(p.prob);
      const chosen = p.chosen ? 'chosen' : '';
      const mark = p.chosen ? ' ✓' : '';
      html += `
        <div class="tt-row ${chosen}">
          <span class="tt-tok" title="${esc(displayStr(p.tok_str))}">${esc(displayStr(p.tok_str))}${mark}</span>
          <div class="tt-bar-wrap">
            <div class="tt-bar" style="width:${barW}%;background:${color}"></div>
          </div>
          <span class="tt-pct">${pct}%</span>
        </div>`;
    });

    tooltip.innerHTML = html;
    tooltip.classList.remove('hidden');
    positionTooltip(e.clientX, e.clientY);
  }

  function onTokenLeave() {
    tooltip.classList.add('hidden');
  }

  function onTokenMove(e) {
    positionTooltip(e.clientX, e.clientY);
  }

  function positionTooltip(cx, cy) {
    const m = 14;
    const tw = tooltip.offsetWidth || 240;
    const th = tooltip.offsetHeight || 160;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let x = cx + m;
    let y = cy + m;
    if (x + tw > vw - m) x = cx - tw - m;
    if (y + th > vh - m) y = cy - th - m;
    if (x < m) x = m;
    if (y < m) y = m;

    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }

  // --- Generate ---
  function setGenerating(v) {
    generating = v;
    const btn = document.getElementById('generateBtn');
    if (v) {
      btn.textContent = 'Stop';
      btn.classList.add('stopping');
    } else {
      btn.textContent = 'Generate';
      btn.classList.remove('stopping');
    }
    document.getElementById('clearBtn').disabled = v;
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function clearOutput() {
    document.getElementById('output').innerHTML = '';
    setStatus('');
  }

  async function handleGenerate() {
    if (generating) {
      abortController?.abort();
      return;
    }

    const serverUrl = currentServerUrl();
    const model     = document.getElementById('model').value;
    const prompt    = document.getElementById('prompt').value;
    const nPredict  = parseInt(document.getElementById('nPredict').value) || 200;
    const nProbs    = parseInt(document.getElementById('nProbs').value) || 5;
    const temp      = parseFloat(document.getElementById('temperature').value);

    clearOutput();
    setGenerating(true);
    setStatus('接続中...');

    abortController = new AbortController();
    const outputEl = document.getElementById('output');

    try {
      const res = await fetch(`${serverUrl}/completion`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          n_predict: nPredict,
          n_probs:   nProbs,
          temperature: isNaN(temp) ? 0.8 : temp,
          stream: true,
          ...(model ? { model } : {}),
        }),
        signal: abortController.signal,
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }

      setStatus('生成中...');

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let tokenCount = 0;
      let stopped = false;

      outer: while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });

        let nl;
        while ((nl = buf.indexOf('\n')) !== -1) {
          const line = buf.slice(0, nl).trimEnd();
          buf = buf.slice(nl + 1);

          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') { stopped = true; break outer; }

          let data;
          try { data = JSON.parse(raw); } catch { continue; }

          if (data.stop) { stopped = true; break outer; }

          const content = data.content ?? '';
          let probs = [];
          if (Array.isArray(data.completion_probabilities) && data.completion_probabilities.length > 0) {
            const cp = data.completion_probabilities[0];
            // 新しい llama-server は top_logprobs(token/logprob)、旧版は probs(tok_str/prob)
            const cands = cp.top_logprobs ?? cp.probs ?? [];
            const chosenId = cp.id;
            probs = cands.map(c => ({
              tok_str: c.token ?? c.tok_str ?? '',
              prob: c.prob != null ? c.prob
                  : (c.logprob != null ? Math.exp(c.logprob) : 0),
              chosen: (chosenId != null && c.id === chosenId),
            }));
            // 実際に選択されたトークンが上位候補に含まれない場合は追加
            if (!probs.some(p => p.chosen)) {
              probs.push({
                tok_str: cp.token ?? content,
                prob: cp.logprob != null ? Math.exp(cp.logprob) : 0,
                chosen: true,
              });
            }
            probs.sort((a, b) => b.prob - a.prob);
          }

          if (content !== '') {
            outputEl.appendChild(makeToken(content, probs));
            tokenCount++;
          }
        }
      }

      setStatus(`完了 — ${tokenCount} トークン生成`);

    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('停止しました');
      } else {
        setStatus(`エラー: ${err.message}`, true);
        console.error(err);
      }
    } finally {
      setGenerating(false);
    }
  }

  document.getElementById('generateBtn').addEventListener('click', handleGenerate);
  document.getElementById('clearBtn').addEventListener('click', clearOutput);
  document.getElementById('refreshModelsBtn').addEventListener('click', loadModels);
  // Server URL 変更時に一覧を再取得
  document.getElementById('serverUrl').addEventListener('change', loadModels);
  // 初回ロード
  loadModels();

  document.getElementById('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleGenerate();
    }
  });
</script>
</body>
</html>
